<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#1b2a41"><title>Ludo Classic – Mardochée MC</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:radial-gradient(#27406a,#14213a);color:#fff;font-family:system-ui,sans-serif;overflow:hidden;touch-action:manipulation}
#app{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:env(safe-area-inset-top) 8px env(safe-area-inset-bottom)}
#ttl{font-size:12px;font-weight:700;letter-spacing:.5px;padding-top:6px;color:#ffb703}#pl{display:flex;gap:10px;padding-top:4px}
.av{width:62px;text-align:center;font-size:11px;opacity:.55;transition:.3s}
.av .ph{width:54px;height:54px;border-radius:50%;border:4px solid var(--c);background:#fff center/cover;margin:0 auto 2px;display:flex;align-items:center;justify-content:center;font-size:28px}
.av.on{opacity:1}.av.on .ph{animation:bob .7s infinite alternate;box-shadow:0 0 14px var(--c)}
.av.shake .ph{animation:shake .5s}.av.win .ph{animation:win .6s infinite alternate}
@keyframes bob{to{transform:translateY(-6px) scale(1.08)}}
@keyframes shake{20%,60%{transform:translateX(-7px) rotate(-8deg)}40%,80%{transform:translateX(7px) rotate(8deg)}}
@keyframes win{to{transform:scale(1.25) rotate(8deg)}}
#status{font-size:16px;font-weight:600;padding:6px;text-align:center;min-height:34px}
canvas{background:#fff;border-radius:10px;box-shadow:0 4px 20px #0008}
#bar{display:flex;gap:12px;align-items:center;padding:10px}
button{font:inherit;border:0;border-radius:14px;padding:13px 20px;background:#ffb703;color:#222;font-weight:700;font-size:18px}
button:disabled{opacity:.4}.sm{background:#334e68;color:#fff;font-size:14px;padding:10px 12px}.sel{outline:3px solid #fff}
#dslot{width:70px;height:70px}
#dice{position:fixed;left:10px;top:60%;width:70px;height:70px;perspective:420px;z-index:6;cursor:grab;touch-action:none;user-select:none}.cube{width:70px;height:70px;position:relative;transform-style:preserve-3d}.f{position:absolute;inset:0;background:linear-gradient(145deg,#fff,#d6d6d6);border-radius:12px;display:grid;grid-template:repeat(3,1fr)/repeat(3,1fr);padding:9px;backface-visibility:hidden;box-shadow:inset 0 0 8px #0004}.f i{display:flex;align-items:center;justify-content:center}.f b{width:13px;height:13px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#555,#111)}.f b.r1{width:18px;height:18px;background:radial-gradient(circle at 35% 30%,#ff8a80,#c62828)}
#menu{position:fixed;inset:0;z-index:10;display:flex;overflow:auto;text-align:center;background:radial-gradient(circle at 50% 0,#2d4f8a,#101a30 70%)}
#menu.hide{display:none}
.mi{margin:auto;width:min(92vw,380px);display:flex;flex-direction:column;align-items:center;gap:12px;padding:22px 18px;background:#ffffff12;border:1px solid #ffffff30;border-radius:28px;box-shadow:0 20px 50px #0008}
#menu .ph{width:92px;height:92px;border-radius:50%;border:4px solid #ffb703;background:center/cover;box-shadow:0 0 24px #ffb70088;animation:bob 1.6s infinite alternate}
#menu h1{font-size:38px;margin:0;line-height:1;background:linear-gradient(90deg,#ff5252,#ffd54f,#69f0ae,#40c4ff);-webkit-background-clip:text;background-clip:text;color:transparent}
.by{margin-top:-6px;font-weight:800;color:#ffb703;letter-spacing:3px;font-size:13px}
.lb{font-size:12px;opacity:.7;text-transform:uppercase;letter-spacing:1.5px;margin:4px 0 -4px}
.seg{display:flex;gap:6px;background:#0004;padding:4px;border-radius:16px}.seg button{padding:9px 14px;font-size:14px;background:transparent;color:#fff;border-radius:12px;outline:0}.seg button.sel{background:#ffb703;color:#222}
#cs{display:flex;gap:12px}#cs button{width:46px;height:46px;border-radius:50%;padding:0;border:3px solid #fff5;background:var(--c);transition:.2s;outline:0}#cs button.sel{transform:scale(1.25);border-color:#fff;box-shadow:0 0 16px var(--c)}
#opp{font-size:13px;opacity:.9;min-height:18px}
#tr{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}#tr button{padding:8px 11px;font-size:13px;background:#ffffff1c;color:#fff;border-radius:12px;border:2px solid transparent;outline:0}#tr button.sel{border-color:#ffb703}
#pn{display:flex;gap:8px;width:100%}#pn button{flex:1;padding:14px 4px;font-size:15px;line-height:1.3;background:linear-gradient(#ffd54f,#ffa000);box-shadow:0 5px 0 #b36b00;border-radius:16px}#pn button:active{transform:translateY(4px);box-shadow:0 1px 0 #b36b00}
#cf{position:fixed;inset:0;pointer-events:none;background:none;box-shadow:none;border-radius:0;z-index:5}
#status{background:#ffffff14;border-radius:14px;padding:6px 14px;margin:4px 0;display:flex;align-items:center;justify-content:center}
#roll{background:linear-gradient(#ffd54f,#ffa000);box-shadow:0 4px 0 #b36b00}#roll:not(:disabled){animation:pulse 1.2s infinite}#roll:active{transform:translateY(3px)}
@keyframes pulse{50%{box-shadow:0 4px 0 #b36b00,0 0 18px #ffd54f}}
canvas#c{box-shadow:0 0 0 4px #ffffff22,0 8px 24px #0009}
.hint{font-size:12px;opacity:.75;line-height:1.4}
#dsh{position:absolute;inset:7px;border-radius:30%;background:#000;filter:blur(6px);opacity:.35;pointer-events:none}
</style></head><body>

function sim(vx0,vy0,h0,gentle){return new Promise(res=>{
 simOn=true;moved=true;const r=dc.getBoundingClientRect();px=r.left;py=r.top;hz=35+(h0==null?30:h0);
 const rnd=a=>(Math.random()-.5)*a,sp=Math.hypot(vx0||0,vy0||0);
 let vx=vx0==null?rnd(260):vx0,vy=vy0==null?rnd(260):vy0,vz=gentle?0:380+sp*.15+(vx0==null?330:0);
 let w=gentle?[rnd(3),rnd(3),rnd(3)]:[-vy/35*.8+rnd(20),vx/35*.8+rnd(20),rnd(14)];
 const g=3200,I=70*70/6,s=35,dt=1/180,CR=[];let calm=0,t=0;
 for(const a of[-s,s])for(const b of[-s,s])for(const c of[-s,s])CR.push([a,b,c]);
 const frame=()=>{
  for(let k=0;k<3;k++){
   vz-=g*dt;hz+=vz*dt;px+=vx*dt;py+=vy*dt;
   const wl=Math.hypot(w[0],w[1],w[2]);if(wl>1e-6)rotW([w[0]/wl,w[1]/wl,w[2]/wl],wl*dt);
   const a=nz(CM[0]);let b=CM[1];const d=dt3(b,a);b=nz([b[0]-d*a[0],b[1]-d*a[1],b[2]-d*a[2]]);CM=[a,b,cr(a,b)];
   let touch=false;
   for(let it=0;it<2;it++)CR.forEach(c=>{
    const q=[0,1,2].map(i=>c[0]*CM[0][i]+c[1]*CM[1][i]+c[2]*CM[2][i]);
    if(hz+q[2]>0)return;touch=true;
    const wq=cr(w,q),vc=[vx+wq[0],vy+wq[1],vz+wq[2]];
    if(vc[2]<0){const rn=cr(q,[0,0,1]),den=1+dt3(rn,rn)/I,e=-vc[2]>140?.42:0,j=-(1+e)*vc[2]/den;
     if(e&&it==0&&-vc[2]>200)bump(-vc[2]);
     vz+=j;let tq=cr(q,[0,0,j]);w=[w[0]+tq[0]/I,w[1]+tq[1]/I,w[2]+tq[2]/I];
     const w2=cr(w,q),tv=[vx+w2[0],vy+w2[1]],tl=Math.hypot(tv[0],tv[1]);
     if(tl>1e-3){const tt=[tv[0]/tl,tv[1]/tl,0],rt=cr(q,tt),jt=Math.min(tl/(1+dt3(rt,rt)/I),.55*j);
      vx-=jt*tt[0];vy-=jt*tt[1];tq=cr(q,[-jt*tt[0],-jt*tt[1],0]);w=[w[0]+tq[0]/I,w[1]+tq[1]/I,w[2]+tq[2]/I]}}});
   let mn=1e9;CR.forEach(c=>{const z=hz+c[0]*CM[0][2]+c[1]*CM[1][2]+c[2]*CM[2][2];if(z<mn)mn=z});if(mn<0)hz-=mn;
   if(touch){const slow=Math.hypot(vx,vy)<120;w=w.map(q=>q*(slow?.95:.992));vx*=.997;vy*=.997}
   const W=innerWidth-70,Hh=innerHeight-70;
   if(px<0){px=0;vx=Math.abs(vx)*.5;w[2]+=rnd(6);bump(Math.abs(vx)*2)}if(px>W){px=W;vx=-Math.abs(vx)*.5;w[2]+=rnd(6);bump(Math.abs(vx)*2)}
   if(py<0){py=0;vy=Math.abs(vy)*.5;w[2]+=rnd(6);bump(Math.abs(vy)*2)}if(py>Hh){py=Hh;vy=-Math.abs(vy)*.5;w[2]+=rnd(6);bump(Math.abs(vy)*2)}
  }
  const u=upFace();t+=1/60;
  if(hz<36.5&&Math.hypot(vx,vy,vz)<25&&Math.hypot(w[0],w[1],w[2])<1.2&&u[1]>.985)calm++;else calm=0;
  if(calm>10||t>7){const f=upFace(),ax=cr(f[2],[0,0,1]),sn=Math.hypot(ax[0],ax[1],ax[2]);if(sn>1e-5)rotW([ax[0]/sn,ax[1]/sn,ax[2]/sn],Math.atan2(sn,f[2][2]));hz=35;render();simOn=false;res(f[0])}
  else{render();requestAnimationFrame(frame)}};
 requestAnimationFrame(frame)})}

const up=c=>{if(!dr)return;clearTimeout(dr.tm);const d=dr;dr=null;dc.style.filter='';

 if(d.dm=='move'){let vx=0,vy=0;const s=d.s;if(s.length>1){const a=s[0],b=s[s.length-1],dt=Math.max(1,b[0]-a[0]);vx=(b[1]-a[1])/dt*1000;vy=(b[2]-a[2])/dt*1000}

 go()};
